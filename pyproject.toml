[project]
name = "so101-rl"
version = "0.1.0"
description = "SO-101 goal-conditioned RL stack with a policy-independent safety layer"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are declared in [tool.pixi]; pip install support is deferred to Stage B/C.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_rl"]

[tool.pytest.ini_options]
markers = [
    "hardware: needs the real arm (SO101_HW=1)",
    "gpu: needs CUDA",
    "slow: long-running test",
    "regression: regression test",
    "integration: end-to-end test with real processes (systemd --user units, MCP over stdio)",
]
addopts = "-ra --timeout=120"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["src/so101_rl/_vendor"]   # generated by scripts/vendor_tdmpc2.py

[tool.ruff.lint.per-file-ignores]
"scripts/vendor_tdmpc2.py" = ["ISC004"]   # patch tables are lists of implicitly concatenated strings

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.system-requirements]
cuda = "12"   # lets the lock solve the gpu env on hosts without a driver (this host: driver down)

[tool.pixi.activation]
env = { PYTHONNOUSERSITE = "1" }   # keep ~/.local site-packages out of the env

[tool.pixi.dependencies]
python = "3.12.*"
numpy = "2.2.*"   # lerobot 0.6.1 needs numpy < 2.3
pytorch = "2.11.*"   # one torch in every env; lerobot 0.6.1 needs torch < 2.12
torchvision = ">=0.26,<0.27"
torchcodec = "*"
pyserial = ">=3.5"
pyyaml = "*"
h5py = "*"
gymnasium = ">=1.1.1,<1.3"   # stable-baselines3 2.7/2.8 require gymnasium<1.3
psutil = "*"
pytest = "*"
pytest-timeout = "*"
hypothesis = "*"
ruff = "*"
setuptools = ">=71,<82"   # lerobot 0.6.1 requires setuptools<82; conda solve would otherwise pick 84
packaging = ">=24.2,<26"   # lerobot 0.6.1 pin (conda would otherwise pick 26.x)

[tool.pixi.pypi-dependencies]
so101-rl = { path = ".", editable = true }
lerobot = { version = "==0.6.1", extras = ["feetech", "grpcio-dep"] }

[tool.pixi.feature.sim.dependencies]
# One MuJoCo in every sim-capable env (plan §10 2026-10-05, D-PIN); mujoco-warp versions track mujoco.
mujoco-python = "3.14.*"
mujoco-warp = "3.14.*"
warp-lang = ">=1.17,<2"

[tool.pixi.feature.perception.dependencies]
opencv = ">=4.9,<4.14"   # lerobot 0.6.1 needs opencv-python-headless<4.14

[tool.pixi.feature.perception.pypi-dependencies]
pyrealsense2 = ">=2.57"

[tool.pixi.feature.train.dependencies]
tensorboard = "*"   # the live dashboard (viz.monitor / viz.dashboard; SUV, integration 2026-10-06)
moviepy = ">=1.0.3,<2"   # TensorBoard rollout videos inline (plan §10 2026-10-06); torch add_video imports moviepy.editor, gone in 2.x
mcp = "2.3.*"   # MVP connector MCP server (plans/mvp-plan.md M5; stdio)
nvidia-ml-py = "*"   # NVML thermal fail-closed for training jobs (plan §10 P8)

[tool.pixi.feature.train.pypi-dependencies]
torchrl = "*"
tensordict = "*"
stable-baselines3 = ">=2.7"
hydra-core = "*"
omegaconf = "*"
termcolor = "*"
pandas = "*"
cma = "*"   # CMA-ES for the sysid fit (S2)

[tool.pixi.feature.gpu.dependencies]
pytorch-gpu = "2.11.*"
cuda-version = "12.9.*"   # D-CUDA: matches the cuda129 warp-lang build (driver 610.57); fallback 12.8 / 12.6

[tool.pixi.feature.cpu.dependencies]
pytorch-cpu = "2.11.*"

[tool.pixi.environments]
default = ["sim", "perception", "train", "gpu"]
cpu = ["sim", "perception", "train", "cpu"]
robot = ["perception", "cpu"]   # servo host: torch only as lerobot needs it, CPU build

[tool.pixi.tasks]
test = 'pytest -m "not hardware and not gpu"'
test-hw = { cmd = "pytest -m hardware", env = { SO101_HW = "1" } }
lint = "ruff check src tests scripts"
ci = { depends-on = ["lint", "test"] }
smoke-tdmpc2 = "python -m so101_rl.rl.smoke_tdmpc2"
fetch-assets = "python scripts/fetch_assets.py"
extract-kinematics = "python scripts/extract_kinematics.py"
servo = "python -m so101_rl.servo.main"
servo-fake = "python -m so101_rl.servo.main --backend fake --calibration tests/data/so101_follower.calib.json"
soak = "python -m so101_rl.servo.soak"
soak-fake = "python -m so101_rl.servo.soak --backend fake --calibration tests/data/so101_follower.calib.json"
calib-check = "python -m so101_rl.safety.calib_check"
hand-eye = "python -m so101_rl.perception.calibrate_hand_eye"
compare-real = "python -m so101_rl.sim.compare_real"
# Sim-first track (plans/sim-track-implementation-plan.md).
test-gpu = 'pytest -m "gpu and not hardware"'
ci-gpu = { depends-on = ["lint", "test", "test-gpu"] }
bench-warp = "python scripts/bench_warp.py"
# Sim wave 1 (SU1, SU2, SUV; integration 2026-10-06).
sim-parity = "pytest tests/test_batched_parity.py"   # no -m filter: the CPU layer A and the GPU layers B and C
tray-check = "python -m so101_rl.sim.tray_check"
sysid-excite = "python -m so101_rl.sim.sysid.run_excitation"
sysid-fit = "python -m so101_rl.sim.sysid.fit"
sysid-from-logs = "python -m so101_rl.sim.sysid.from_deploy"
viz-demo = { cmd = "python -m so101_rl.viz.demo", env = { MUJOCO_GL = "egl" } }   # headless rendering
viz-attach = "python -m so101_rl.viz.live_viewer attach"
dashboard = "python -m so101_rl.viz.dashboard"   # --logdir runs/ (default), localhost:6006
# Camera parity unit SUC (plans/camera-parity-plan.md): calib/camera.yaml is the one source of the D435 model.
joint-probe = "python -m so101_rl.servo.probe"   # read-only: ping + block read, never writes, refuses next to the servo
zero-adjust = "python -m so101_rl.servo.zero_adjust"   # joint zeros from camera-calibrate --poses 2; dry-run unless --apply --attended
camera-intrinsics = "python -m so101_rl.perception.camera_intrinsics"   # --serial --out calib/camera.yaml
camera-calibrate = { cmd = "python -m so101_rl.perception.camera_calibrate", env = { MUJOCO_GL = "egl" } }   # --method arm-shape [--poses K] [--from-capture DIR]
camera-overlay = { cmd = "python -m so101_rl.perception.camera_overlay", env = { MUJOCO_GL = "egl" } }
camera-distractors = "python -m so101_rl.perception.distractors"
perception = { cmd = "python -m so101_rl.perception.process", env = { MUJOCO_GL = "egl" } }   # D3: D435 -> die tracker -> object table shm (single writer); --backend sim = MuJoCo renders
# MVP (plans/mvp-plan.md): sim reach trainer (M1-M4) and the minimal lab connector (M5).
sim-gates = "python -m so101_rl.rl.gates"   # --task reach: L1/L2 PASS/FAIL table, exit 0 only when all pass
train-sim-sac = "python -m so101_rl.rl.train_sim_sac"   # --task reach --nworld N --budget-min M
eval-sim = { cmd = "python -m so101_rl.rl.eval_sim", env = { MUJOCO_GL = "egl" } }   # renders eval rollouts headless
export-policy = "python -m so101_rl.rl.policy_export"
deploy-policy = "python -m so101_rl.rl.deploy_policy"   # M7: attaches to a RUNNING servo; --attended on the real arm
train-reach-sac = "python -m so101_rl.rl.train_sac_her"   # S5.2: SB3 SAC + HER fine-tune from a policy export (--backend sim)
lab-mcp = "python -m so101_rl.lab.mcp_server"   # stdio MCP server (.mcp.json); jobs run as transient user units
lab = "python -m so101_rl.lab.cli"   # status | stop <run> | gate-sign <run>
# Planned tasks: each is added in the same commit that creates its module, so `pixi task list` never advertises a
# broken task (tests/test_pixi_tasks.py). Phase 0 U8-U10 / SR1-SR3: random-policy-sim / random-policy-real
# (so101_rl.env.random_policy --backend {sim,real}), train-reach-tdmpc2
# (rl.train_tdmpc2), train-wm-state (wm.train_state_wm), check-milestone (scripts/check_milestone_phase0.py).
# Sim track S5 (deferred after the MVP): pretrain-tdmpc2 (rl.tdmpc2_offline), gap-report (rl.gap_report).
