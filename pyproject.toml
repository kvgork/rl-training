[project]
name = "so101-rl"
version = "0.1.0"
description = "SO-101 goal-conditioned RL stack with a policy-independent safety layer"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are declared in [tool.pixi]; pip install support is deferred to Stage B/C.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_rl"]

[tool.pytest.ini_options]
markers = [
    "hardware: needs the real arm (SO101_HW=1)",
    "gpu: needs CUDA",
    "slow: long-running test",
    "regression: regression test",
]
addopts = "-ra --timeout=120"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["src/so101_rl/_vendor"]   # generated by scripts/vendor_tdmpc2.py

[tool.ruff.lint.per-file-ignores]
"scripts/vendor_tdmpc2.py" = ["ISC004"]   # patch tables are lists of implicitly concatenated strings

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.system-requirements]
cuda = "12"   # lets the lock solve the gpu env on hosts without a driver (this host: driver down)

[tool.pixi.activation]
env = { PYTHONNOUSERSITE = "1" }   # keep ~/.local site-packages out of the env

[tool.pixi.dependencies]
python = "3.12.*"
numpy = "2.2.*"
pytorch = ">=2.7,<2.12"
torchvision = ">=0.22,<0.27"
torchcodec = "*"
pyserial = ">=3.5"
pyyaml = "*"
h5py = "*"
gymnasium = ">=1.1.1,<1.3"   # stable-baselines3 2.7/2.8 require gymnasium<1.3
psutil = "*"
pytest = "*"
pytest-timeout = "*"
hypothesis = "*"
ruff = "*"
setuptools = ">=71,<82"   # lerobot 0.6.1 requires setuptools<82; conda solve would otherwise pick 84
packaging = ">=24.2,<26"   # lerobot 0.6.1 pin (conda would otherwise pick 26.x)

[tool.pixi.pypi-dependencies]
so101-rl = { path = ".", editable = true }
lerobot = { version = "==0.6.1", extras = ["feetech", "grpcio-dep"] }

[tool.pixi.feature.sim.dependencies]
mujoco-python = ">=3.3"

[tool.pixi.feature.perception.dependencies]
opencv = ">=4.9,<4.14"   # lerobot 0.6.1 needs opencv-python-headless<4.14

[tool.pixi.feature.perception.pypi-dependencies]
pyrealsense2 = ">=2.57"

[tool.pixi.feature.train.pypi-dependencies]
torchrl = "*"
tensordict = "*"
stable-baselines3 = ">=2.7"
hydra-core = "*"
omegaconf = "*"
termcolor = "*"
pandas = "*"

[tool.pixi.feature.gpu.dependencies]
pytorch-gpu = "*"
cuda-version = "12.8.*"   # re-pin to the driver's CUDA after H1

[tool.pixi.feature.cpu.dependencies]
pytorch-cpu = "*"

[tool.pixi.environments]
default = ["sim", "perception", "train", "gpu"]
cpu = ["sim", "perception", "train", "cpu"]
robot = ["perception", "cpu"]   # servo host: torch only as lerobot needs it, CPU build

[tool.pixi.tasks]
test = 'pytest -m "not hardware and not gpu"'
test-hw = { cmd = "pytest -m hardware", env = { SO101_HW = "1" } }
lint = "ruff check src tests scripts"
ci = { depends-on = ["lint", "test"] }
smoke-tdmpc2 = "python -m so101_rl.rl.smoke_tdmpc2"
fetch-assets = "python scripts/fetch_assets.py"
extract-kinematics = "python scripts/extract_kinematics.py"
servo = "python -m so101_rl.servo.main"
servo-fake = "python -m so101_rl.servo.main --backend fake"
soak = "python -m so101_rl.servo.soak"
calib-check = "python -m so101_rl.safety.calib_check"
hand-eye = "python -m so101_rl.perception.hand_eye"
random-policy-sim = "python -m so101_rl.env.random_policy --backend sim"
random-policy-real = "python -m so101_rl.env.random_policy --backend real"
train-reach-sac = "python -m so101_rl.rl.train_sac_her"
train-reach-tdmpc2 = "python -m so101_rl.rl.train_tdmpc2"
train-wm-state = "python -m so101_rl.wm.train_state_wm"
check-milestone = "python scripts/check_milestone_phase0.py"
