# Single source of truth for every limit, rate and register value (L4).
# Nothing outside src/so101_rl/config/ may hard-code these numbers (tests/test_config_single_source.py).
# Units: raw servo ticks (0.0879 deg/tick, 0..4095) unless the key says otherwise.

# Flips to true only by a human after H5/H6 measured rest pose and register values on the real arm.
# `check_milestone` reads this flag.
verified_on_hardware: false

port: /dev/ttyACM0
heartbeat_port: null            # dedicated USB-CDC port of the watchdog MCU; null = no MCU attached
calibration_path: ~/.cache/huggingface/lerobot/calibration/robots/so_follower/so101_follower.json
shm_name: so101_servo
kinematics_path: so101_kinematics.yaml     # relative to this file

# Highest temperature the STS3215 firmware itself tolerates; trip_c must stay below it.
firmware_max_temp_c: 70.0

# Config limits; the loader intersects them with the calibration range_min/max (narrowest wins).
joints:
  min_ticks: [0, 0, 0, 0, 0, 0]
  max_ticks: [4095, 4095, 4095, 4095, 4095, 4095]

action:
  max_delta_ticks: [45, 45, 45, 45, 45, 60]            # per 10 Hz command
  tracking_error_ticks: [120, 120, 120, 120, 120, 400] # E
  max_ticks_per_tick: [20, 20, 20, 20, 20, 20]         # per 30 Hz tick
  interp_ticks: 3

thermal:
  trip_c: 60.0
  resume_c: 50.0
  resume_dwell_s: 30.0
  max_trips_per_hour: 3
  duty_on_s: 1200.0
  duty_off_s: 600.0
  stale_temp_s: 1.0

rates:
  servo_hz: 30.0
  policy_hz: 10.0
  stale_cmd_ms: 150.0
  max_consecutive_misses: 5
  heartbeat_timeout_ms: 1000
  max_bus_failures: 3

safe_state:
  # bound_s must cover the worst joint limit -> home plus the exact home -> rest transit at ramp_ticks_per_tick
  # (safety/config_check.py computes it, review B5): 15.33 s with the shipped calibration, 19.23 s for a full 0..4095 range
  # calibration (both include the 1 s margin), so 20 s covers any calibration. The plan's
  # original 5 s is not reachable at 8 ticks/tick (240 ticks/s) from the shoulder_lift limit.
  bound_s: 20.0
  ramp_ticks_per_tick: 8
  # NEEDS H5 (both poses).
  # rest: the gravity-stable pose measured on the arm on 2026-09-30, torque off. Tip (0.208, -0.001, -0.012) m:
  #       inside the box since the floor moved to table + 5 mm (plan §10 2026-10-06), above the table floor.
  # home: in-box PLACEHOLDER from the wave-1 review, tip (0.200, 0.000, 0.150) m, FK-checked by the loader.
  home_ticks: [2047, 960, 2700, 2748, 2047, 2047]
  rest_ticks: [2050, 2200, 2301, 2745, 2040, 2065]
  torque_off_order: [gripper, wrist_roll, wrist_flex, elbow_flex, shoulder_lift, shoulder_pan]
  # Transit zone for the ramps between rest and home (review B1, safety/transit.py), metres, base frame.
  table_z_m: -0.02                # table top (same value as sim TABLE_Z_M)
  table_clearance_m: 0.005        # the ramp target's tip never goes below table_z_m + this
  transit_zone_m: 0.05            # below floor + this, joints that lower the tip wait for the lifting joints
  home_box_margin_m: 0.010        # FK(home) at least this far inside every box face
  rest_tolerance_ticks: 100       # reenergize starts within this of rest (arm joints), or per start_min_tip_z_m
  # Re-energise start rule (plan §10 2026-10-06): away from rest the tip must be inside the box AND at least this
  # high (the old 0.010 m floor, 3 cm above the table). Independent of the running box floor box.z[0] = -0.015.
  start_min_tip_z_m: 0.010

box:                              # metres, base frame (from LIT DEFAULT_BOX)
  x: [0.08, 0.34]
  y: [-0.22, 0.22]
  z: [-0.015, 0.28]               # floor = table + 5 mm (plan §10 2026-10-06): the jaws can reach a die on the table
  present_tolerance_m: 0.005      # BOX_PRESENT trips only this far outside the box (review S3); targets: exact box
  # Gripper floor (plan §10 2026-10-06 / 2026-10-07): the LOWEST wrist/gripper point (so101_kinematics.yaml
  # floor_points) stays >= safe_state.table_z_m + this (1 mm above the table); the tip keeps z[0] = -0.015.
  gripper_floor_clearance_m: 0.001
  gripper_present_tolerance_m: 0.002  # BOX_PRESENT for the gripper points: <= ~1 mm into the table

registers:
  return_delay_time: 0
  operating_mode: 0
  p_coefficient: 16
  i_coefficient: 0
  d_coefficient: 32
  maximum_acceleration: 254
  acceleration: 254
  protection_current: 250        # gripper default from lerobot; arm value measured in H6
  overload_torque: 25
  over_current_protection_time: 20   # UNVERIFIED default; H6 proves fold-back

sim_warp:                         # FS1: MuJoCo Warp buffer sizes (S0 spike 2026-10-05, plans/reviews/...-mjwarp-feasibility-spike.md)
  njmax: 256                      # constraint rows per world; MJWarp's default 64 overflows on this scene (peak nefc 188 measured)
  nconmax_per_world: 32           # contacts per world (CPU max ncon 18); naconmax = nconmax_per_world * nworld
  nworld_default: 1024
  overflow_check_every_steps: 10  # policy steps between overflow reads (one device->host sync each)
  overflow_policy: fail           # the only value: an overflow raises ContactBufferOverflow

tasks:                            # FS4 per-task reward + die success (plan §10 2026-10-06; env/tasks.py, env/reward.py)
  # reward = sum(weight * term). Every term is <= 0 and weights are >= 0, so no step earns a positive reward
  # (env.reward.validate_reward_spec proves it whenever a TaskSpec is built). Terms (env/reward.py):
  #   distance:  -|achieved - desired| / scale_m; zero_on_success: 0 on steps where the success predicate holds
  #   success:   -1 unless the instantaneous success predicate holds (0 then)
  #   clamp:     -1 on steps where the safety chain clamped the action (info["action_clamped"])
  #   action_l2: -mean(applied_action^2), applied_action in [-1, 1] (info["applied_action"])
  #   time:      constant -1 per step, NOT zeroed on in-zone steps; weight must be > 0 so every non-terminal step
  #              is strictly < 0 and finishing beats keeping the die moving inside the zone forever
  # trip_penalty: reward of a step that trips NAN/RANGE/BOX_PRESENT/STUCK; that step is TERMINAL (no bootstrap) and
  #   pays this instead of the step reward, whatever the goal (HER-safe). Must be <= episode_steps x the worst step
  #   reward (env.reward.validate_trip_penalty): 100 x -(0.607 m box diagonal / 0.30 + 1 + 0.05) = -307.3, so a
  #   trip is worse than ANY trip-free rest of the episode, for every gamma <= 1 (plan §10 2026-10-08 "Trip penalty")
  reach:
    trip_penalty: -310.0
    reward:
      distance: {weight: 1.0, scale_m: 0.30, zero_on_success: true}
      success: {weight: 1.0}
      time: {weight: 0.05}
  die_to_zone:
    max_height_m: 0.016           # die centroid at most this far above the goal (D435 depth noise); 2 cm up fails
    settle_mm: 3.0                # success: 2 consecutive visible in-zone steps moving <= this between them
    trip_penalty: -310.0
    reward:
      distance: {weight: 1.0, scale_m: 0.30, zero_on_success: true}
      success: {weight: 1.0}
      time: {weight: 0.05}
